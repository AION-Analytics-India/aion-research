<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="po-title po-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="po-title">The pre-open auction from 9:00 to 9:15 AM and the first real option price</title>
  <desc id="po-desc">A timeline from 9:00 to 9:20 AM. From 9:00 to 9:05 limit and market orders are entered and an indicative opening price moves as orders arrive. From 9:05 to 9:10 only limit orders are accepted, and the stage closes at a random moment between 9:08 and 9:10. From 9:10 to 9:12 orders are matched at one price and the opening price is fixed. From 9:12 to 9:15 is a buffer. At 9:15 continuous trading begins. Below, the option price shown on screen stays flat at the previous close until 9:15 and then jumps to its first real traded price. A note reads: pre-open prices are indicative, and for options the first real price prints at 9:15 AM.</desc>
  <rect width="960" height="500" fill="#ffffff"/>
  <rect x="12" y="12" width="936" height="450" rx="8" fill="#f7f9fc" stroke="#d5dbe5"/>

  <!-- phase bands -->
  <rect x="60" y="40" width="210" height="78" fill="#eff8ff" stroke="#b2ddff"/>
  <rect x="270" y="40" width="210" height="78" fill="#e0f2fe" stroke="#b2ddff"/>
  <rect x="480" y="40" width="84" height="78" fill="#fff6ed" stroke="#f9dbaf"/>
  <rect x="564" y="40" width="126" height="78" fill="#f2f4f7" stroke="#d0d5dd"/>
  <rect x="690" y="40" width="210" height="78" fill="#ecfdf3" stroke="#abefc6"/>
  <g font-size="13.5" font-weight="700" text-anchor="middle">
    <text x="165.0" y="66" fill="#175cd3">Order entry</text>
    <text x="375.0" y="66" fill="#175cd3">Limit orders only</text>
    <text x="522.0" y="66" fill="#b93815">Match</text>
    <text x="627.0" y="66" fill="#475467">Buffer</text>
    <text x="795.0" y="66" fill="#067647">Continuous trading</text>
  </g>
  <g font-size="11" fill="#475467" text-anchor="middle">
    <text x="165.0" y="86">Limit and market orders.</text>
    <text x="165.0" y="102">Nothing trades.</text>
    <text x="375.0" y="86">Closes at a random moment</text>
    <text x="375.0" y="102">between 9:08 and 9:10.</text>
    <text x="522.0" y="86">One price</text>
    <text x="522.0" y="102">per stock.</text>
    <text x="627.0" y="86">Orders carried</text>
    <text x="627.0" y="102">over.</text>
    <text x="795.0" y="86">Options trade for the</text>
    <text x="795.0" y="102">first time today.</text>
  </g>
  <line x1="60" y1="118" x2="900" y2="118" stroke="#667085" stroke-width="1.2"/>
  <line x1="60" y1="118" x2="60" y2="126" stroke="#667085"/><text x="60" y="142" font-size="12.5" fill="#344054" text-anchor="middle">9:00</text><line x1="270" y1="118" x2="270" y2="126" stroke="#667085"/><text x="270" y="142" font-size="12.5" fill="#344054" text-anchor="middle">9:05</text><line x1="480" y1="118" x2="480" y2="126" stroke="#667085"/><text x="480" y="142" font-size="12.5" fill="#344054" text-anchor="middle">9:10</text><line x1="564" y1="118" x2="564" y2="126" stroke="#667085"/><text x="564" y="142" font-size="12.5" fill="#344054" text-anchor="middle">9:12</text><line x1="690" y1="118" x2="690" y2="126" stroke="#667085"/><text x="690" y="142" font-size="12.5" fill="#344054" text-anchor="middle">9:15</text><line x1="900" y1="118" x2="900" y2="126" stroke="#667085"/><text x="900" y="142" font-size="12.5" fill="#344054" text-anchor="middle">9:20</text>

  <!-- 9:15 marker -->
  <line x1="690" y1="150" x2="690" y2="392" stroke="#067647" stroke-width="1.6" stroke-dasharray="5 4"/>

  <!-- index row -->
  <text x="60" y="178" font-size="13" font-weight="700" fill="#101828">Index</text>
  <path d="M60.0,250 L70.5,247 L81.0,241 L91.5,245 L102.0,255 L112.5,246 L123.0,237 L133.5,244 L144.0,235 L154.5,232 L165.0,239 L175.5,230 L186.0,237 L196.5,231 L207.0,222 L217.5,214 L228.0,218 L238.5,222 L249.0,214 L259.5,214 L270.0,214 L280.5,221 L291.0,225 L301.5,216 L312.0,223 L322.5,214 L333.0,214 L343.5,224 L354.0,234 L364.5,241 L375.0,232 L385.5,239 L396.0,246 L406.5,250 L417.0,241 L427.5,235 L438.0,226 L448.5,233 L459.0,227 L469.5,224 L480.0,228" fill="none" stroke="#175cd3" stroke-width="2.2" stroke-dasharray="4 4"/>
  <line x1="480" y1="228" x2="690" y2="228" stroke="#175cd3" stroke-width="2.6"/>
  <path d="M690.0,228 L700.5,224 L711.0,229 L721.5,222 L732.0,227 L742.5,225 L753.0,230 L763.5,238 L774.0,234 L784.5,227 L795.0,232 L805.5,237 L816.0,245 L826.5,241 L837.0,239 L847.5,232 L858.0,237 L868.5,245 L879.0,238 L889.5,243 L900.0,236" fill="none" stroke="#175cd3" stroke-width="2.6"/>
  <text x="64" y="204" font-size="12" fill="#175cd3">Indicative opening price. It moves as orders arrive.</text>
  <text x="585.0" y="218" font-size="12" fill="#175cd3" text-anchor="middle">Opening price fixed</text>

  <!-- option row -->
  <text x="60" y="318" font-size="13" font-weight="700" fill="#101828">Option LTP on screen</text>
  <line x1="60" y1="372" x2="690" y2="372" stroke="#b42318" stroke-width="2.6"/>
  <line x1="690" y1="372" x2="690" y2="330" stroke="#b42318" stroke-width="2.6"/>
  <path d="M690.0,330 L700.5,327 L711.0,329 L721.5,323 L732.0,321 L742.5,326 L753.0,320 L763.5,318 L774.0,312 L784.5,310 L795.0,307 L805.5,311 L816.0,316 L826.5,314 L837.0,318 L847.5,320 L858.0,324 L868.5,322 L879.0,326 L889.5,328 L900.0,330" fill="none" stroke="#b42318" stroke-width="2.6"/>
  <text x="64" y="362" font-size="12" fill="#b42318">Previous session's close. Stale for the whole auction.</text>
  <text x="700" y="388" font-size="12" font-weight="700" fill="#b42318">Jumps to the first real trade</text>

  <!-- note -->
  <rect x="150" y="408" width="660" height="40" rx="10" fill="#fff6ed" stroke="#f9dbaf" stroke-width="1.4"/>
  <text x="480" y="433" font-size="13.5" font-weight="700" fill="#b93815" text-anchor="middle">Pre-open prices are indicative. For options, the first real price prints at 9:15 AM.</text>
  <text x="480" y="486" font-size="11.5" fill="#667085" text-anchor="middle">Schematic for explanation only. Not market data. AION Analytics (India).</text>
</svg>
