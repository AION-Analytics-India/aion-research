<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-label="Options Greeks and Taylor Series intuition diagram">
  <rect width="800" height="380" fill="#0d1a2e" rx="12"/>
  <!-- Axes -->
  <line x1="80" y1="40" x2="80" y2="310" stroke="#2a3f5f" stroke-width="1.5"/>
  <line x1="80" y1="310" x2="740" y2="310" stroke="#2a3f5f" stroke-width="1.5"/>
  <text x="35" y="180" fill="#8898B3" font-size="11" font-family="system-ui,sans-serif" transform="rotate(-90,35,180)">Option Price</text>
  <text x="700" y="330" fill="#8898B3" font-size="11" font-family="system-ui,sans-serif">Underlying Price →</text>
  <!-- Current price vertical -->
  <line x1="380" y1="50" x2="380" y2="310" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="382" y="60" fill="#4A5568" font-size="10" font-family="system-ui,sans-serif">Current price (S)</text>
  <!-- Actual option curve (quadratic-like, convex) -->
  <path d="M80,295 Q200,285 380,210 Q520,145 680,80" fill="none" stroke="#00D4FF" stroke-width="3" stroke-linecap="round"/>
  <text x="695" y="76" fill="#00D4FF" font-size="11" font-family="system-ui,sans-serif">Actual price</text>
  <!-- Delta tangent line at S=380 (slope = delta) -->
  <line x1="200" y1="265" x2="580" y2="155" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6,3" opacity="0.9"/>
  <!-- Delta label -->
  <text x="590" y="150" fill="#F59E0B" font-size="12" font-family="system-ui,sans-serif" font-weight="700">Δ (Delta)</text>
  <text x="590" y="163" fill="#F59E0B" font-size="10" font-family="system-ui,sans-serif">First-order slope</text>
  <!-- Gamma arc label -->
  <text x="440" y="140" fill="#A78BFA" font-size="12" font-family="system-ui,sans-serif" font-weight="700">Γ (Gamma)</text>
  <text x="440" y="153" fill="#A78BFA" font-size="10" font-family="system-ui,sans-serif">Gap = curvature</text>
  <!-- Gap arrow showing gamma -->
  <line x1="500" y1="175" x2="500" y2="148" stroke="#A78BFA" stroke-width="1.5" marker-end="url(#arrowP)"/>
  <line x1="500" y1="175" x2="500" y2="195" stroke="#A78BFA" stroke-width="1.5" marker-end="url(#arrowPd)"/>
  <!-- Theta label -->
  <text x="85" y="80" fill="#EF4444" font-size="12" font-family="system-ui,sans-serif" font-weight="700">θ (Theta)</text>
  <text x="85" y="93" fill="#EF4444" font-size="10" font-family="system-ui,sans-serif">Time decay: price falls</text>
  <text x="85" y="105" fill="#EF4444" font-size="10" font-family="system-ui,sans-serif">as expiry approaches</text>
  <!-- Taylor expansion formula -->
  <rect x="180" y="325" width="420" height="46" rx="6" fill="rgba(0,212,255,0.06)" stroke="rgba(0,212,255,0.2)" stroke-width="1"/>
  <text x="390" y="346" fill="#E8ECF3" font-size="12.5" font-family="'Courier New',monospace" text-anchor="middle">f(S+δS) ≈ f(S) + f′(S)·δS + ½f″(S)·δS²</text>
  <text x="390" y="363" fill="#8898B3" font-size="10.5" font-family="system-ui,sans-serif" text-anchor="middle">Δ carries the first term · Γ carries the second · θ reduces f(S) over time</text>
  <text x="85" y="36" fill="#E8ECF3" font-size="13" font-family="system-ui,sans-serif" font-weight="700">OPTIONS GREEKS VIA TAYLOR SERIES</text>
  <defs>
    <marker id="arrowP" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,7 L3.5,0 L7,7 Z" fill="#A78BFA"/></marker>
    <marker id="arrowPd" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,0 L3.5,7 L7,0 Z" fill="#A78BFA"/></marker>
  </defs>
</svg>