  <text x="480" y="451" font-size="13" fill="#101828" text-anchor="middle" font-weight="600">24,800</text>
  <!-- spot -->
  <line x1="150" y1="266" x2="810" y2="266" stroke="#101828" stroke-width="1.8" stroke-dasharray="6 4"/>
  <rect x="424" y="254" width="112" height="24" rx="12" fill="#101828"/>
