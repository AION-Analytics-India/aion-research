  <!-- hedging arrows -->
  <line x1="836" y1="260" x2="836" y2="140" stroke="#067647" stroke-width="3.5" marker-end="url(#oi-g)"/>
  <g font-size="12.5" font-weight="700" fill="#067647"><text x="848" y="188">Desks buy</text><text x="848" y="205">futures as</text><text x="848" y="222">price nears</text><text x="848" y="239">the wall</text></g>
  <line x1="124" y1="272" x2="124" y2="388" stroke="#b42318" stroke-width="3.5" marker-end="url(#oi-r)"/>
  <g font-size="12.5" font-weight="700" fill="#b42318" text-anchor="end"><text x="112" y="312">Desks sell</text><text x="112" y="329">futures as</text><text x="112" y="346">price nears</text><text x="112" y="363">the wall</text></g>
  <!-- note -->
  <text x="480" y="486" font-size="13.5" font-weight="700" fill="#101828" text-anchor="middle">OI shows where positions are concentrated. Hedging shows how they will be defended.</text>
  <text x="480" y="526" font-size="11.5" fill="#667085" text-anchor="middle">Schematic for explanation only. Not market data. AION Analytics (India).</text>
</svg>
