<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="vc-title vc-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="vc-title">The VIX crush: delta profit, vega loss and net option premium after the open</title>
  <desc id="vc-desc">A chart of the change in an option's premium from 9:15 AM to 10:30 AM. The delta profit line rises quickly at the open and then slowly. The vega loss line falls sharply in the first minutes and then flattens. The net premium line rises briefly, crosses below the entry premium within about ten minutes, and stays below it. A shaded band marks the profit window from 9:15 to 9:20 AM. A note reads: direction was right, timing was wrong.</desc>
