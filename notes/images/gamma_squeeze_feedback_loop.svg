<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="gs-title gs-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="gs-title">Gamma squeeze: the positive feedback loop in dealer hedging</title>
  <desc id="gs-desc">A loop of four steps. Dealers have sold Calls. Price rises toward the strike. Dealers buy the underlying to hedge. Price rises further, which returns to the first step with a larger hedge needed. In the centre a computer server runs on a treadmill, labelled dealer hedging engine. A side note lists what breaks the squeeze: the options expire, hedging capital runs out, or the buying exhausts itself.</desc>
  <defs>
    <marker id="gs-arr" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="18" refX="15" refY="9" orient="auto">
      <path d="M0,0 L20,9 L0,18 Z" fill="#b93815"/>
    </marker>
  </defs>

  <rect width="960" height="520" fill="#ffffff"/>
  <rect x="12" y="12" width="936" height="468" rx="8" fill="#f7f9fc" stroke="#d5dbe5"/>

  <!-- Loop arrows -->
  <g fill="none" stroke="#b93815" stroke-width="5" stroke-linecap="round" marker-end="url(#gs-arr)">
    <path d="M466,92 Q540,112 548,214"/>
    <path d="M548,302 Q540,412 476,434"/>
    <path d="M254,436 Q180,412 172,308"/>
    <path d="M172,218 Q180,112 244,94"/>
  </g>

  <!-- Nodes -->
  <g fill="#ffffff" stroke="#344054" stroke-width="1.6">
    <rect x="254" y="50" width="212" height="68" rx="10"/>
    <rect x="442" y="226" width="212" height="68" rx="10"/>
    <rect x="254" y="402" width="212" height="68" rx="10"/>
    <rect x="66" y="226" width="212" height="68" rx="10"/>
  </g>
  <g font-size="14.5" font-weight="700" fill="#101828" text-anchor="middle">
    <text x="360" y="79">1. Dealers have sold Calls</text>
    <text x="548" y="255">2. Price rises toward strike</text>
    <text x="360" y="431">3. Dealers buy the underlying</text>
    <text x="172" y="255">4. Price rises further</text>
  </g>
  <g font-size="12" fill="#475467" text-anchor="middle">
    <text x="360" y="99">They are short Calls and short gamma</text>
    <text x="548" y="275">The delta of those Calls goes up</text>
    <text x="360" y="451">Buying needed to stay delta-neutral</text>
    <text x="172" y="275">The hedge is too small again</text>
  </g>

  <!-- Loop label -->
  <text x="360" y="168" font-size="15" font-weight="700" fill="#b93815" text-anchor="middle">Positive feedback loop</text>

  <!-- Centre icon: a server running on a treadmill -->
  <g transform="translate(360,262)">
    <!-- treadmill belt -->
    <g transform="rotate(-5)">
      <rect x="-58" y="34" width="112" height="12" rx="6" fill="#344054"/>
      <circle cx="-52" cy="40" r="3" fill="#98a2b3"/>
      <circle cx="48" cy="40" r="3" fill="#98a2b3"/>
    </g>
    <!-- treadmill post and handle -->
    <path d="M50,32 L60,-22 L42,-22" fill="none" stroke="#344054" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-64" y="46" width="130" height="5" rx="2" fill="#98a2b3"/>
    <!-- server legs -->
    <path d="M-14,22 L-24,36 M6,22 L16,33" stroke="#344054" stroke-width="3.5" stroke-linecap="round"/>
    <!-- server body -->
    <rect x="-28" y="-34" width="48" height="58" rx="5" fill="#175cd3" stroke="#0b3d91" stroke-width="1.5"/>
    <g fill="#d1e9ff">
      <rect x="-22" y="-27" width="36" height="9" rx="2"/>
      <rect x="-22" y="-13" width="36" height="9" rx="2"/>
      <rect x="-22" y="1" width="36" height="9" rx="2"/>
    </g>
    <g fill="#12b76a">
      <circle cx="8" cy="-22.5" r="2"/>
      <circle cx="8" cy="-8.5" r="2"/>
    </g>
    <circle cx="8" cy="5.5" r="2" fill="#f04438"/>
    <!-- sweat drops -->
    <g fill="#53b1fd">
      <path d="M-40,-30 q-5,8 0,11 q5,-3 0,-11 Z"/>
      <path d="M-48,-10 q-4,7 0,9.5 q4,-2.5 0,-9.5 Z"/>
      <path d="M30,-40 q-4,7 0,9.5 q4,-2.5 0,-9.5 Z"/>
    </g>
    <!-- motion lines -->
    <g stroke="#98a2b3" stroke-width="2" stroke-linecap="round">
      <line x1="-70" y1="2" x2="-52" y2="2"/>
      <line x1="-76" y1="14" x2="-54" y2="14"/>
    </g>
  </g>
  <text x="360" y="340" font-size="13" font-weight="700" fill="#101828" text-anchor="middle">Dealer hedging engine</text>
  <text x="360" y="357" font-size="11.5" fill="#475467" text-anchor="middle">Rule-driven. It does not choose to squeeze.</text>

  <!-- Side note -->
  <rect x="690" y="150" width="240" height="220" rx="10" fill="#fff6ed" stroke="#f9dbaf" stroke-width="1.4"/>
  <text x="708" y="182" font-size="14.5" font-weight="700" fill="#b93815">The squeeze breaks when</text>
  <g font-size="13.5" fill="#101828">
    <circle cx="714" cy="214" r="3.5" fill="#b93815"/>
    <text x="728" y="219">the options expire and the</text>
    <text x="728" y="237">open interest is gone,</text>
    <circle cx="714" cy="266" r="3.5" fill="#b93815"/>
    <text x="728" y="271">hedging capital runs out, or</text>
    <circle cx="714" cy="300" r="3.5" fill="#b93815"/>
    <text x="728" y="305">the buying exhausts itself.</text>
  </g>
  <text x="708" y="346" font-size="11.5" fill="#475467">Until then each lap is larger.</text>

  <text x="480" y="504" font-size="11.5" fill="#667085" text-anchor="middle">Schematic for explanation only. Not market data. AION Analytics (India).</text>
</svg>
