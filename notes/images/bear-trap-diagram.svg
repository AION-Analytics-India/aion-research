<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-label="Bear Trap pattern diagram">
  <rect width="800" height="380" fill="#0d1a2e" rx="12"/>
  <line x1="80" y1="40" x2="80" y2="320" stroke="#1e3a5f" stroke-width="1"/>
  <line x1="80" y1="320" x2="750" y2="320" stroke="#1e3a5f" stroke-width="1"/>
  <!-- Support line -->
  <line x1="80" y1="210" x2="750" y2="210" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.7"/>
  <text x="754" y="214" fill="#22C55E" font-size="11" font-family="system-ui,sans-serif">Support</text>
  <!-- Price path: decline → false breakdown → sharp reversal -->
  <polyline points="80,100 140,120 200,140 260,165 320,185 370,195 410,205 440,225 465,255 480,280 495,265 510,240 535,215 565,190 610,165 660,140 710,120 750,110" fill="none" stroke="#00D4FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Breakdown zone -->
  <rect x="430" y="248" width="110" height="28" rx="5" fill="rgba(34,197,94,0.12)" stroke="#22C55E" stroke-width="1"/>
  <text x="485" y="267" fill="#22C55E" font-size="11" font-family="system-ui,sans-serif" text-anchor="middle">False Breakdown</text>
  <!-- Short entry arrow -->
  <line x1="478" y1="247" x2="480" y2="275" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrowR2)"/>
  <text x="430" y="243" fill="#EF4444" font-size="10.5" font-family="system-ui,sans-serif">Panic shorts enter</text>
  <!-- Reversal -->
  <line x1="530" y1="230" x2="590" y2="170" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrowY2)"/>
  <text x="540" y="156" fill="#F59E0B" font-size="10.5" font-family="system-ui,sans-serif">Smart money absorbs → sharp reversal</text>
  <text x="400" y="350" fill="#8898B3" font-size="12" font-family="system-ui,sans-serif" text-anchor="middle">Price breaks below support → panic shorts enter → institutional buyers absorb supply → price reverses sharply</text>
  <text x="85" y="36" fill="#E8ECF3" font-size="13" font-family="system-ui,sans-serif" font-weight="700">BEAR TRAP</text>
  <text x="85" y="52" fill="#4A5568" font-size="10" font-family="system-ui,sans-serif">PRICE</text>
  <text x="695" y="340" fill="#4A5568" font-size="10" font-family="system-ui,sans-serif">TIME →</text>
  <defs>
    <marker id="arrowR2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#EF4444"/></marker>
    <marker id="arrowY2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#F59E0B"/></marker>
  </defs>
</svg>