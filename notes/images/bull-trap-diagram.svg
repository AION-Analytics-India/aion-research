<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-label="Bull Trap pattern diagram">
  <rect width="800" height="380" fill="#0d1a2e" rx="12"/>
  <!-- Grid lines -->
  <line x1="80" y1="40" x2="80" y2="320" stroke="#1e3a5f" stroke-width="1"/>
  <line x1="80" y1="320" x2="750" y2="320" stroke="#1e3a5f" stroke-width="1"/>
  <!-- Resistance line -->
  <line x1="80" y1="160" x2="750" y2="160" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.7"/>
  <text x="754" y="164" fill="#F59E0B" font-size="11" font-family="system-ui,sans-serif">Resistance</text>
  <!-- Price path: build-up → false breakout → reversal -->
  <polyline points="80,280 160,250 220,230 280,200 340,185 380,175 420,155 450,120 470,100 490,115 510,145 540,170 580,200 620,230 660,250 700,265 740,270" fill="none" stroke="#00D4FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Breakout zone marker -->
  <rect x="400" y="88" width="110" height="28" rx="5" fill="rgba(245,158,11,0.15)" stroke="#F59E0B" stroke-width="1"/>
  <text x="455" y="107" fill="#F59E0B" font-size="11" font-family="system-ui,sans-serif" text-anchor="middle">False Breakout</text>
  <!-- Retail entry arrow -->
  <line x1="455" y1="118" x2="470" y2="100" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <text x="395" y="78" fill="#EF4444" font-size="10.5" font-family="system-ui,sans-serif">Retail buyers enter</text>
  <!-- Reversal arrow -->
  <line x1="550" y1="140" x2="620" y2="220" stroke="#22C55E" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="585" y="138" fill="#22C55E" font-size="10.5" font-family="system-ui,sans-serif">Smart money exits</text>
  <!-- Labels -->
  <text x="400" y="350" fill="#8898B3" font-size="12" font-family="system-ui,sans-serif" text-anchor="middle">Price breaks above resistance → retail buyers pile in → strong hands sell into strength → price reverses below resistance</text>
  <text x="85" y="36" fill="#E8ECF3" font-size="13" font-family="system-ui,sans-serif" font-weight="700">BULL TRAP</text>
  <text x="85" y="52" fill="#4A5568" font-size="10" font-family="system-ui,sans-serif">PRICE</text>
  <text x="695" y="340" fill="#4A5568" font-size="10" font-family="system-ui,sans-serif">TIME →</text>
  <defs>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#EF4444"/></marker>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#22C55E"/></marker>
  </defs>
</svg>